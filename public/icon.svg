<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" shape-rendering="crispEdges">
  <rect width="128" height="128" rx="20" fill="#050510" />
  <rect x="8" y="8" width="112" height="112" rx="14" fill="#0B1021" stroke="#00F0FF" stroke-width="3" />
  <!-- Top red sensor dome -->
  <rect x="46" y="16" width="36" height="8" fill="#08080C" />
  <rect x="50" y="18" width="28" height="6" fill="#FF1744" />
  <rect x="52" y="18" width="10" height="3" fill="#FF8A80" />
  <!-- Ear hubs -->
  <rect x="16" y="38" width="8" height="20" fill="#78909C" stroke="#08080C" stroke-width="2" />
  <rect x="104" y="38" width="8" height="20" fill="#546E7A" stroke="#08080C" stroke-width="2" />
  <!-- Head chassis -->
  <rect x="24" y="24" width="80" height="46" fill="#546E7A" stroke="#08080C" stroke-width="4" />
  <rect x="26" y="26" width="76" height="4" fill="#B0BEC5" />
  <!-- Black screen -->
  <rect x="32" y="32" width="64" height="30" fill="#0A0A0A" />
  <!-- Cyan pixel eyes -->
  <rect x="42" y="40" width="16" height="14" fill="#00F0FF" />
  <rect x="70" y="40" width="16" height="14" fill="#00F0FF" />
  <!-- Torso -->
  <rect x="34" y="72" width="60" height="30" fill="#546E7A" stroke="#08080C" stroke-width="4" />
  <!-- Yellow Plus (+) -->
  <rect x="46" y="77" width="6" height="16" fill="#FFD600" stroke="#08080C" stroke-width="1" />
  <rect x="41" y="82" width="16" height="6" fill="#FFD600" stroke="#08080C" stroke-width="1" />
  <!-- 3 Vertical LEDs (Green, Yellow, Red) -->
  <rect x="74" y="76" width="12" height="22" fill="#263238" />
  <rect x="77" y="78" width="6" height="5" fill="#00E676" />
  <rect x="77" y="85" width="6" height="4" fill="#FFD600" />
  <rect x="77" y="91" width="6" height="5" fill="#FF1744" />
  <!-- Tank Treads -->
  <rect x="26" y="98" width="24" height="18" fill="#455A64" stroke="#08080C" stroke-width="3" />
  <rect x="78" y="98" width="24" height="18" fill="#455A64" stroke="#08080C" stroke-width="3" />
  <rect x="30" y="102" width="16" height="3" fill="#CFD8DC" />
  <rect x="30" y="108" width="16" height="3" fill="#90A4AE" />
  <rect x="82" y="102" width="16" height="3" fill="#CFD8DC" />
  <rect x="82" y="108" width="16" height="3" fill="#90A4AE" />
</svg>
